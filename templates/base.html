<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>{% block title %}Utilities{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    {% block head_extra %}{% endblock %}
</head>
<body>
    <nav>
        <a href="/">Home</a>
        {% for tool in all_tools %}
        <a href="/tools/{{ tool.slug }}/">{{ tool.name }}</a>
        {% endfor %}
    </nav>
    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
