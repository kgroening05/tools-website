{% extends "base.html" %}

{% block title %}MarkItDown — Utilities{% endblock %}

{% block content %}
  <h1>MarkItDown</h1>
  <p>Convert a document to Markdown.</p>

  <form method="post"
        action="/tools/markitdown/convert"
        enctype="multipart/form-data">
    <label>
      File
      <input type="file" name="file" required>
    </label>
    <button type="submit">Convert</button>
  </form>

  {% if markdown %}
    <h2>Result{% if filename %}: {{ filename }}{% endif %}</h2>
    <pre style="white-space: pre-wrap; word-wrap: break-word;">{{ markdown }}</pre>
  {% endif %}
{% endblock %}
