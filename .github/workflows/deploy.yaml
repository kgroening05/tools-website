name: Deploy to Orange Pi

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-orangepi
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.13"

      - name: Sync deps (sanity check the lockfile builds)
        run: uv sync

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Deploy over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" bash <<'REMOTE'
            set -euo pipefail
            cd /home/deploy/apps/utilities
            git fetch --prune origin
            git reset --hard origin/main
            /home/deploy/.local/bin/uv sync
            sudo /usr/bin/systemctl restart utilities
            sleep 3
            curl -fsS http://127.0.0.1:8000/ > /dev/null
            echo "deploy ok"
          REMOTE